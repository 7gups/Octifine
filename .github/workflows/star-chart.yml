name: star-chart

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "star-chart/**"
      - ".github/workflows/star-chart.yml"

concurrency:
  group: output-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the star chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 star-chart/star_chart.py --repo "${{ github.repository }}" --out dist

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          keep_history: true
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
