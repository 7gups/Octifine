name: Desktop validation
on:
  push:
    paths-ignore:
    - android/**
    - '**/*.md'
    - .github/workflows/android*.yml
    - .github/workflows/snake.yml
    - .github/workflows/star-chart.yml
    - .github/dependabot.yml
  pull_request:
    paths-ignore:
    - android/**
    - '**/*.md'
    - .github/workflows/android*.yml
    - .github/workflows/snake.yml
    - .github/workflows/star-chart.yml
    - .github/dependabot.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: 10.0.x
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.nuget/packages

          ~/.cargo/registry/index

          ~/.cargo/registry/cache

          ~/.cache/voidstrap/zigbuild

          ~/.cache/voidstrap/rcodesign

          '
        key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.*', 'windows/native/**/Cargo.lock') }}
        restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
    - run: dotnet build Voidstrap.sln -c Debug -warnaserror
    - run: dotnet publish src/Voidstrap.App/Voidstrap.csproj -c Release -r win-x64 --self-contained false -o artifacts/windows
    - run: dotnet publish src/Voidstrap.Desktop.Windows/Voidstrap.Desktop.Windows.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows-desktop
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: windows
        path: windows/artifacts
    defaults:
      run:
        working-directory: windows
  client_server:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: 10.0.x
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.nuget/packages

          ~/.cargo/registry/index

          ~/.cargo/registry/cache

          ~/.cache/voidstrap/zigbuild

          ~/.cache/voidstrap/rcodesign

          '
        key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.*', 'windows/native/**/Cargo.lock') }}
        restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
    - run: dotnet build src/ClientServer/ClientServer.slnx -c Debug -warnaserror
    defaults:
      run:
        working-directory: windows
